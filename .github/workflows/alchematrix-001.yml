name: Alchematrix 001 isolated specimen
on:
  pull_request:
    paths:
      - 'experiments/alchematrix-001/**'
      - '.github/workflows/alchematrix-001.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test standalone crafting engine
        run: node --test experiments/alchematrix-001/core.test.mjs
      - name: Check browser scripts
        run: |
          node --check experiments/alchematrix-001/core.mjs
          node --check experiments/alchematrix-001/app.mjs
