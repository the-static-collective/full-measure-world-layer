name: apply-world-server-patch

on:
  push:
    branches:
      - agent/boot-house-runtime-core
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/boot-house-runtime-core
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply bounded server patch
        run: node scripts/patch-world-server.mjs

      - name: Verify patch scope
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          if [ -n "$changed" ] && [ "$changed" != "server.ts" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit server mount when needed
        shell: bash
        run: |
          if git diff --quiet -- server.ts; then
            echo "server.ts already mounted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "feat: mount world runtime API"
          git push origin HEAD:agent/boot-house-runtime-core
